server {
    listen 443 ssl;
    http2 on;
    server_name 94.232.42.94;
    ssl_certificate /etc/letsencrypt/live/94.232.42.94/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94.232.42.94/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;
    client_max_body_size 21m;
    error_page 497 =301 https://94.232.42.94:6752$request_uri;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}

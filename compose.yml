name: cyber-svodka
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    GIGACHAT_CA_BUNDLE: /app/config/certs/russian-root.crt
  networks: [internal]
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks: [internal]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  nginx:
    image: nginx:1.30.6-alpine
    ports: ["127.0.0.1:${LOCAL_HTTP_PORT:-6752}:80"]
    volumes: ["./infra/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [internal]
    restart: unless-stopped
    depends_on:
      frontend: {condition: service_healthy}
volumes:
  pgdata:
networks:
  internal:

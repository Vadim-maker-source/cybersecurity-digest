services:
  backend:
    environment:
      APP_ENV: server
      ENABLE_DEMO: "false"
      COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: ${SERVER_PUBLIC_BASE_URL:-https://94.232.42.94:6752}
  worker:
    environment:
      APP_ENV: server
      ENABLE_DEMO: "false"
      COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: ${SERVER_PUBLIC_BASE_URL:-https://94.232.42.94:6752}
  nginx:
    ports: !override ["0.0.0.0:6752:443"]
    volumes: !override
      - ./infra/nginx/server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./shared/letsencrypt:/etc/letsencrypt:ro
  acme:
    image: nginx:1.30.6-alpine
    ports: ["0.0.0.0:80:80"]
    volumes:
      - ./infra/nginx/acme.conf:/etc/nginx/conf.d/default.conf:ro
      - ./shared/acme:/var/www/acme:ro
    networks: [internal]
    restart: unless-stopped
